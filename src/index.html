<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Page</title>
</head>
<body>
    <header>
        <nav>
            <ul id="tab-list">
                <li class="nav-tab">Home</li>
                <li class="nav-tab">Menu</li>
                <li class="nav-tab">Contact</li>
            </ul>
        </nav>
    </header>
    <main>
        <!--! Tab 2 -->
        <section class="tab" id="Menu">
            <!-- Main Dishes -->
            <div class="menu-holder" id="main-dish-menu-holder">
                <h3>Main Dishes</h3>
                <div id="main-dish-menu">
                    <div class="main-dish-card">
                        <div class="card-text">
                            <p class="dish-name">Dish name</p>
                            <p class="dish-price">price</p>
                            <p class="dish-info">dish goog</p>
                        </div>
                        <!-- todo replace with img in js -->
                        <div class="dish-photo">dish photo</div>
                    </div>
                </div>
            </div>
            <!-- Desserts -->
            <div class="menu-holder" id="dessert-menu-holder">
                <h3>Desserts</h3>
                <div class="dessert-menu">
                    <div class="dessert-card">
                        <div class="card-text">
                            <p class="dish-name">Dish name</p>
                            <p class="dish-price">price</p>
                            <p class="dish-info">dish goog</p>
                        </div>
                        <!-- todo replace with img in js -->
                        <div class="dish-photo">dish photo</div>
                    </div>
                </div>
            </div>
            <!-- Beverages -->
            <div class="menu-holder" id="beverage-menu-holder">
                <h3>Beverages</h3>
                <div class="beverage-menu">
                    <div class="beverage-card">
                        <div class="card-text">
                            <p class="dish-name">Dish name</p>
                            <p class="dish-price">price</p>
                            <p class="dish-info">dish goog</p>
                        </div>
                        <!-- todo replace with img in js -->
                        <div class="dish-photo">dish photo</div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <footer>Copyright © Lobster Burrow 2026</footer>
</body>
</html>
